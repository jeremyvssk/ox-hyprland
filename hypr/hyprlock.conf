general {
    hide_cursor = true
    grace = 0
    no_fade_in = false
}

background {
    monitor =
    path = screenshot
    blur_passes = 2
    blur_size = 6
    noise = 0.0117
    contrast = 0.9
    brightness = 0.85
    vibrancy = 0.15
}

label {
    monitor =
    text = cmd[update:1000] date +"%H"
    color = rgba(255, 255, 255, 1.0)
    font_size = 120
    position = 0, 310
    halign = center
    valign = center
}

label {
    monitor =
    text = cmd[update:1000] date +"%M"
    color = rgba(255, 255, 255, 1.0)
    font_size = 120
    position = 0, 180
    halign = center
    valign = center
}

label {
    monitor =
    text = cmd[update:60000] date +"%A, %B %-d"
    color = rgba(255, 255, 255, 1.0)
    font_size = 20
    position = 0, 80
    halign = center
    valign = center
}

input-field {
    monitor =
    size = 280, 44
    position = 0, 0
    halign = center
    valign = center

    outline_thickness = 1
    dots_size = 0.22
    dots_spacing = 0.35
    dots_center = true
    rounding = -1

    outer_color = rgba(157, 124, 216, 0.75)
    inner_color = rgba(0, 0, 0, 0)
    font_color = rgba(255, 255, 255, 0.95)
    check_color = rgba(157, 124, 216, 0.6)
    fail_color = rgba(204, 34, 34, 0.6)

    placeholder_text =
    fail_text = <i>$FAIL <b>($ATTEMPTS)</b></i>
    hide_input = false
    fade_on_empty = false
}
